name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ekstrak ZIP bila ada
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -oq "$z" -d extracted
          done || true

      - name: Cari folder proyek
        id: find
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts TIDAK DITEMUKAN. Isi repo:"
            find . -not -path './.git/*' | head -50
            exit 1
          fi
          echo "Proyek ada di: $(dirname "$FILE")"
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EMENG-PROXXY-debug
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
